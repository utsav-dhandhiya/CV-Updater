[project]
name = "cv-updater"
version = "0.1.0"
description = "MCP server that tailors a CV to a job description and renders it into a chosen template"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
]

[project.scripts]
cv-updater = "cv_updater.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_updater"]
